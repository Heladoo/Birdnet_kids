<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birdnet Kids - Bird sounds!</title>
<link rel="icon" href="favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<a class="expert-link" href="expert.html" title="Expert data view" aria-label="Expert data view">🔬</a>
<header>
  <img class="logo-badge" src="logo-badge.png" alt="BirdNET Kids">
  <p class="subtitle">Tap a bird to hear its song</p>
</header>

<p class="control-label">Sort</p>
<div class="sort-buttons">
  <button class="sort-btn active" data-sort="last_seen">🕓 Newest</button>
  <button class="sort-btn" data-sort="week_count">🐣 Common</button>
  <button class="sort-btn" data-sort="certainty">🎯 Certainty</button>
</div>

<p class="control-label">Filter</p>
<div class="filter-buttons">
  <button class="filter-btn active" data-badge="">All</button>
  <button class="filter-btn" data-badge="🏠">🏠 Resident</button>
  <button class="filter-btn" data-badge="✈️">✈️ Migrant</button>
  <button class="filter-btn" data-badge="💎">💎 Rare</button>
  <button class="filter-btn" data-badge="🦅">🦅 Raptor</button>
  <button class="filter-btn" data-badge="🌊">🌊 Waterbird</button>
  <button class="filter-btn" data-badge="🌙">🌙 Nocturnal</button>
  <button class="filter-btn" data-badge="🌅">🌅 Dawn Caller</button>
</div>

<div class="grid" id="grid">
  <p class="loading">Loading birds...</p>
</div>
<p class="empty-state" id="empty-state" style="display:none;">No birds match this filter yet!</p>

<footer class="credits">
  <a href="https://github.com/Nachtzuster/BirdNET-Pi" target="_blank" rel="noopener">Powered by BirdNET-Pi</a>
  <span class="credits-sep">·</span>
  <a href="https://app.birdweather.com/stations/18372" target="_blank" rel="noopener">Our BirdWeather station</a>
</footer>
<p class="visit-counter"><span id="visit-count">–</span> visits</p>

<audio id="player"></audio>

<!-- Single shared modal, populated per-click from the clicked card's data
     object (see openModal() in app.js) rather than one DOM subtree per card. -->
<div id="bird-modal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name-en">
    <span class="modal-close" role="button" tabindex="0" aria-label="Close">✕</span>
    <div class="modal-header">
      <img class="modal-photo" src="bird-placeholder.svg" alt="" onerror="this.onerror=null;this.src='bird-placeholder.svg';">
      <div class="modal-credit"></div>
      <div class="modal-title">
        <span class="modal-name-en" id="modal-name-en"></span>
        <span class="modal-name-he" lang="he" dir="rtl"></span>
        <span class="modal-sci"></span>
      </div>
    </div>
    <div class="modal-badges"></div>
    <div class="modal-player">
      <div class="player-visual" title="Click or drag to jump to a moment">
        <canvas class="player-canvas" width="800" height="144"></canvas>
        <div class="player-freq"></div>
        <div class="player-playhead"></div>
        <div class="player-status"></div>
      </div>
      <div class="player-controls">
        <button type="button" class="player-btn" aria-label="Play or pause">▶</button>
        <span class="player-time">0.0 / 0.0 s</span>
        <span class="player-legend">Pitch (kHz) above, loudness below</span>
      </div>
      <audio class="modal-audio" preload="auto"></audio>
    </div>
    <div class="modal-clips"></div>
    <div class="modal-clip-info"></div>
    <div class="modal-second-opinion"></div>
    <div class="modal-scores"></div>
    <div class="modal-suggestions"></div>
    <dl class="modal-facts"></dl>
    <div class="modal-graph">
      <p class="control-label">Detections over time</p>
      <div class="period-toggle">
        <button type="button" class="period-btn active" data-period="daily">1 Month</button>
        <button type="button" class="period-btn" data-period="weekly">1 Year</button>
        <button type="button" class="period-btn" data-period="tod">Time of day</button>
      </div>
      <div class="chart-wrap"></div>
    </div>
  </div>
</div>

<script src="stats.js?v=1"></script>
<script src="app.js?v=15"></script>
</body>
</html>
